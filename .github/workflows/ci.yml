name: AgentMacArthur CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: agentmacarthur
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agentmacarthur"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      AGENT_PROVIDER: mock
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ci_test_password
      DB_NAME: agentmacarthur
      DB_TEST_NAME: agentmacarthur_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create test database
        run: createdb --host localhost --username postgres agentmacarthur_test
        env:
          PGPASSWORD: ci_test_password

      - name: Run application database migrations
        run: npm run migrate

      - name: Run test database migrations
        run: npm run migrate
        env:
          DB_NAME: agentmacarthur_test
          DB_TEST_NAME: agentmacarthur_ci_unused

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Run tests with coverage
        run: npx vitest run --coverage

      - name: Build production application
        run: npm run build
