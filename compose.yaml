services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file}
      POSTGRES_DB: ${DB_NAME:-agentmacarthur}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    image: agentmacarthur:local
    build:
      context: .
      target: production
    restart: "no"
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-development}
      AGENT_PROVIDER: ${AGENT_PROVIDER:-mock}
    command: ["npm", "run", "migrate:prod"]
    depends_on:
      postgres:
        condition: service_healthy

  app:
    image: agentmacarthur:local
    build:
      context: .
      target: production
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-development}
      AGENT_PROVIDER: ${AGENT_PROVIDER:-mock}
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
